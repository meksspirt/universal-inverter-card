# ==============================================================================
# Вспомогательные Template-сенсоры для инвертора Aninerel ANL-4200T + BMS Redodo
# Добавьте эти сенсоры в ваш configuration.yaml (секция template:) или через UI Helpers
# ==============================================================================

template:
  - sensor:
      # 1. Собственное потребление инвертора 24/7 (Холостой ход + потери преобразования)
      # Учитывает как работу от сети (с внешним Zigbee-автоматом), так и работу от АКБ (Off-Grid)
      - name: "Aninerel ANL-4200T-24L-W-PRO Инвертор: Собственное потребление"
        unique_id: aninerel_inverter_self_consumption_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash-outline
        state: >
          {% set mode = states('sensor.aninerel_anl_4200t_24l_w_pro_operating_mode') | lower %}
          {% set load = states('sensor.aninerel_anl_4200t_24l_w_pro_load_power') | float(0) %}
          {% set bat_p = states('sensor.kukhnia_redodo_24v_bms_to_inverter_rs485_bridge_redodo_24v_power') | float(states('sensor.aninerel_anl_4200t_24l_w_pro_battery_power') | float(0)) %}
          {% set plug_p = states('sensor.invertor_vkhod_power') | float(0) %}
          {% set grid_p = states('sensor.aninerel_anl_4200t_24l_w_pro_grid_power') | float(0) %}
          {% set ac_in = plug_p if plug_p > 0 else grid_p %}
          {% if 'battery' in mode or 'off' in mode or ac_in < 10 %}
            {% set dis = -bat_p if bat_p < 0 else 0 %}
            {% if dis > load %}
              {{ (dis - load) | round(1) }}
            {% elif dis > 0 %}
              {{ (dis * 0.12) | round(1) }}
            {% else %}
              0.0
            {% endif %}
          {% else %}
            {% set chg = bat_p if bat_p > 0 else 0 %}
            {% set diff = ac_in - load - (chg / 0.92) %}
            {{ [25.0, diff] | max | round(1) if ac_in > 20 else 0.0 }}
          {% endif %}

      # 2. Суточная автономность АКБ в режиме ИБП (%)
      - name: "Инвертор: Суточная автономность АКБ"
        unique_id: aninerel_daily_battery_autonomy
        unit_of_measurement: "%"
        icon: mdi:shield-battery-outline
        state: >
          {% set dis = states('sensor.aninerel_anl_4200t_24l_w_pro_estimated_battery_discharge_energy_today') | float(0) %}
          {% set load = states('sensor.aninerel_anl_4200t_24l_w_pro_estimated_load_energy_today') | float(0) %}
          {% if load > 0 %}
            {{ [100, [0, ((dis / load) * 100) | round(1)] | max] | min }}
          {% else %}
            0
          {% endif %}

      # 3. Направление и статус потока батареи
      - name: "Инвертор: Статус батареи"
        unique_id: aninerel_battery_flow_status
        icon: mdi:battery-sync
        state: >
          {% set p = states('sensor.aninerel_anl_4200t_24l_w_pro_battery_power') | float(0) %}
          {% if p > 20 %}
            Заряжается (+{{ p | round(0) }} Вт)
          {% elif p < -20 %}
            Разряжается ({{ p | round(0) }} Вт)
          {% else %}
            Режим ожидания
          {% endif %}

      # 4. Человекочитаемое описание кода ошибки
      - name: "Инвертор: Описание ошибки"
        unique_id: aninerel_fault_description
        icon: mdi:alert-circle-outline
        state: >
          {% set code = states('sensor.aninerel_anl_4200t_24l_w_pro_fault_code') | int(0) %}
          {% set faults = {
            0: 'Ошибок нет',
            1: 'Вентилятор заблокирован',
            2: 'Перегрев инвертора',
            3: 'Перенапряжение батареи',
            4: 'Глубокий разряд батареи',
            5: 'Короткое замыкание на выходе 230В',
            6: 'Выходное напряжение завышено',
            7: 'Таймаут перегрузки мощности',
            8: 'Перенапряжение шины DC',
            9: 'Ошибка плавного пуска шины',
            51: 'Токовая перегрузка транзисторов',
            52: 'Просадка напряжения шины DC',
            53: 'Ошибка самотестирования инвертора',
            58: 'Выходное напряжение занижено'
          } %}
          {{ faults.get(code, 'Неизвестный код сбоя: ' ~ code) }}
